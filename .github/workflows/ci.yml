name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install application and test dependencies
        run: |
          pip install -r requirements.txt
          pip install -e .
      - run: ruff check src app tests case_triage.py
      - run: pytest -q
      - run: docker compose config
      - run: docker build -t fraud-streaming-platform:test .
