services:
  redpanda:
    image: docker.redpanda.com/redpandadata/redpanda:v24.3.18
    command:
      - redpanda
      - start
      - --overprovisioned
      - --smp
      - "1"
      - --memory
      - 1G
      - --reserve-memory
      - 0M
      - --node-id
      - "0"
      - --check=false
      - --kafka-addr
      - INTERNAL://0.0.0.0:9092,OUTSIDE://0.0.0.0:19092
      - --advertise-kafka-addr
      - INTERNAL://redpanda:9092,OUTSIDE://localhost:19092
    ports:
      - "19092:19092"
      - "9644:9644"
    healthcheck:
      test: ["CMD-SHELL", "rpk cluster health --exit-when-healthy"]
      interval: 5s
      timeout: 5s
      retries: 20

  topics:
    image: docker.redpanda.com/redpandadata/redpanda:v24.3.18
    depends_on:
      redpanda:
        condition: service_healthy
    entrypoint: ["/bin/sh", "-c"]
    command: >
      "rpk topic create transactions --brokers redpanda:9092 || true;
       rpk topic create fraud-alerts --brokers redpanda:9092 || true"

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: fraud
      POSTGRES_USER: fraud
      POSTGRES_PASSWORD: fraud
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fraud -d fraud"]
      interval: 3s
      timeout: 2s
      retries: 20
    volumes:
      - fraud_postgres:/var/lib/postgresql/data

  worker:
    build: .
    command: ["python", "-m", "src.worker", "--bootstrap", "redpanda:9092", "--dsn", "postgresql://fraud:fraud@postgres:5432/fraud"]
    depends_on:
      topics:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
    restart: unless-stopped

  api:
    build: .
    command: ["uvicorn", "app.api:app", "--host", "0.0.0.0", "--port", "8000"]
    environment:
      POSTGRES_DSN: postgresql://fraud:fraud@postgres:5432/fraud
    depends_on:
      postgres:
        condition: service_healthy
      worker:
        condition: service_started
    ports:
      - "8000:8000"
    restart: unless-stopped

  console:
    image: docker.redpanda.com/redpandadata/console:v2.8.4
    environment:
      KAFKA_BROKERS: redpanda:9092
    depends_on:
      redpanda:
        condition: service_healthy
    ports:
      - "8081:8080"

volumes:
  fraud_postgres:
